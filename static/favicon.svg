<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background with rounded corners (matches card color) -->
  <rect width="100" height="100" rx="22" fill="#fcfcfe"/>

  <!-- Tomato/Clock Body (matches Work color) -->
  <circle cx="50" cy="55" r="28" fill="#e07a5f"/>

  <!-- Tomato Leaf (matches Short Break color) -->
  <path d="M50 27 Q 35 15 25 25 Q 35 30 50 30 Z" fill="#81b29a"/>

  <!-- Clock Hands (matches card color for contrast) -->
  <line x1="50" y1="55" x2="50" y2="35" stroke="#fcfcfe" stroke-width="5" stroke-linecap="round"/>
  <line x1="50" y1="55" x2="65" y2="55" stroke="#fcfcfe" stroke-width="5" stroke-linecap="round"/>
</svg>