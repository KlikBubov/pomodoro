<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pomodoro — Focus Timer</title>
    <meta name="description"
          content="Pomodoro timer to boost your productivity. 25-minute focus sessions, 5-minute breaks. No ads, no tracking.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Pomodoro — Focus Timer">
    <meta property="og:description" content="Pomodoro timer to boost your productivity.">
    <meta property="og:url" content="https://{{ domain }}/">

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Pomodoro Timer",
            "url": "https://{{ domain }}/",
            "description": "Pomodoro timer to increase productivity.",
            "applicationCategory": "UtilityApplication",
            "operatingSystem": "Web"
        }
    </script>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#f0f2f5">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    {% if umami_id %}
    <script defer src="{{ umami_url }}/script.js" data-website-id="{{ umami_id }}"></script>
    {% endif %}

    {% if sentry_dsn %}
    <script src="https://cdn.jsdelivr.net/npm/@sentry/browser@7.94.1/build/bundle.min.js"></script>
    {% endif %}

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<!-- Top Right Controls -->
<div class="top-right-controls">
    <select id="lang-selector" class="lang-selector" aria-label="Language">
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ru">RU</option>
        <option value="pt">PT</option>
        <option value="de">DE</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
        <option value="pl">PL</option>
        <option value="nl">NL</option>
        <option value="tr">TR</option>
    </select>
    <button id="profile-btn" class="profile-btn" aria-label="Profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
    </button>
</div>

<div class="app-container">
    <main class="pomodoro-card">
        <header class="brand">
            <span class="brand-dot"></span>
            <h1 data-i18n="pomodoro">Pomodoro</h1>
        </header>

        <nav class="mode-tabs" role="tablist">
            <button class="mode-tab active" data-mode="work" data-i18n="focus">Focus</button>
            <button class="mode-tab" data-mode="short" data-i18n="short_break">Short Break</button>
            <button class="mode-tab" data-mode="long" data-i18n="long_break">Long Break</button>
        </nav>

        <div class="timer-container">
            <svg class="progress-ring" viewBox="0 0 280 280">
                <circle class="progress-ring-bg" cx="140" cy="140" r="130"></circle>
                <circle class="progress-ring-fill" cx="140" cy="140" r="130"></circle>
            </svg>
            <div class="timer-display">
                <div class="time">25:00</div>
                <div class="status" data-i18n="time_to_focus">Time to focus</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" data-i18n="start">Start</button>
            <button class="btn btn-reset" aria-label="Reset timer">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </button>
            <button class="btn btn-settings" aria-label="Settings">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <button class="btn btn-tasks" aria-label="Toggle Tasks">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="settings-panel">
            <div class="settings-row"><label for="input-work" data-i18n="focus_min">Focus (min)</label><input
                    type="number" id="input-work" min="1" max="90" value="25"></div>
            <div class="settings-row"><label for="input-short" data-i18n="short_break_min">Short Break
                (min)</label><input type="number" id="input-short" min="1" max="30" value="5"></div>
            <div class="settings-row"><label for="input-long" data-i18n="long_break_min">Long Break (min)</label><input
                    type="number" id="input-long" min="1" max="60" value="15"></div>
            <button class="btn btn-apply" data-i18n="apply">Apply</button>
        </div>

        <footer class="session-counter">
            <span class="session-label"><span data-i18n="round">Round</span> <span class="session-num">1</span></span>
            <div class="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span
                    class="dot"></span><span class="dot"></span></div>
            <a href="/about" class="about-link" data-i18n="what_is_pomodoro">What is Pomodoro?</a>
        </footer>
    </main>

    <aside class="tasks-card">
        <header class="tasks-header"><h2 data-i18n="tasks">Tasks</h2></header>
        <div class="task-input-group"><input type="text" id="task-input" data-i18n-placeholder="add_task_placeholder"
                                             placeholder="Add a new task...">
            <button id="add-task-btn" aria-label="Add task">+</button>
        </div>
        <ul id="task-list" class="task-list"></ul>
    </aside>
</div>

<!-- Auth Modal -->
<div id="auth-modal" class="auth-modal">
    <div class="auth-modal-content">
        <button id="auth-close" class="auth-close" aria-label="Close">&times;</button>
        <div class="auth-tabs" id="auth-tabs">
            <button id="tab-login" class="auth-tab active" data-i18n="login">Login</button>
            <button id="tab-register" class="auth-tab" data-i18n="register">Register</button>
        </div>

        <form id="auth-form" class="auth-form">
            <input type="email" id="auth-email" placeholder="Email" required>
            <input type="password" id="auth-password" placeholder="Password (min 6 chars)" required minlength="6">
            <button type="submit" class="btn btn-auth-submit" data-i18n="submit">Submit</button>
            <div id="auth-error" class="auth-error"></div>
        </form>

        <div id="auth-profile" class="auth-profile" style="display:none;">
            <div class="profile-header">
                <div class="profile-avatar">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="profile-info">
                    <p id="auth-user-email" class="auth-user-email"></p>
                    <span class="profile-status" data-i18n="focus_mode_active">Logged in</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="stat-pomodoros">0</span>
                    <span class="stat-label" data-i18n="pomodoros">Pomodoros</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-time">0h 0m</span>
                    <span class="stat-label" data-i18n="time_focused">Time Focused</span>
                </div>
            </div>

            <div class="profile-actions">
                <a href="/me" class="btn btn-stats" data-i18n="view_stats">View Stats</a>
                <button id="logout-btn" class="btn btn-logout" data-i18n="logout">Logout</button>
            </div>
        </div>
    </div>
</div>

<div class="feedback-widget">
    <button id="feedback-toggle" class="feedback-toggle-btn" data-i18n="feedback">Feedback</button>
    <div id="feedback-form" class="feedback-form">
        <textarea id="feedback-text" data-i18n-placeholder="feedback_placeholder"
                  placeholder="Found a bug? Have a suggestion?"></textarea>
        <button id="submit-feedback" class="feedback-send-btn" data-i18n="send">Send</button>
    </div>
</div>

<script>
    const SETTINGS = {{ settings | tojson }};
    const UMAMI_ENABLED = {{ 'true' if umami_id else 'false' }};
    {% if sentry_dsn %} if (window.Sentry) { Sentry.init({ dsn: "{{ sentry_dsn }}" }); } {% endif %}
</script>
<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/static/js/sw.js', { scope: '/' }).catch(err => console.error('SW registration failed:', err));
        });
    }
</script>
</body>
</html>
