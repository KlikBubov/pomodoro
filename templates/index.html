<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Core SEO Meta Tags -->
    <title>Pomodoro CyberDeck — Free Online Focus Timer</title>
    <meta name="description" content="Increase your productivity with our free online 8-bit styled Pomodoro timer. 25-minute focus sessions, 5-minute breaks. No ads, no tracking, just pure focus.">
    <meta name="keywords" content="pomodoro timer, online timer, focus timer, productivity tool, 25 minute timer, work timer">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Pomodoro CyberDeck — Free Online Focus Timer">
    <meta property="og:description" content="A stylish 8-bit themed Pomodoro timer to boost your productivity.">
    <meta property="og:url" content="https://{{ domain }}/">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pomodoro CyberDeck — Free Online Focus Timer">
    <meta name="twitter:description" content="A stylish 8-bit themed Pomodoro timer to boost your productivity.">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Pomodoro CyberDeck",
      "url": "https://{{ domain }}/",
      "description": "Free online 8-bit styled Pomodoro timer to increase productivity.",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Web"
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    {% if umami_id %}
    <script defer src="{{ umami_url }}/script.js" data-website-id="{{ umami_id }}"></script>
    {% endif %}

    {% if sentry_dsn %}
    <script src="https://cdn.jsdelivr.net/npm/@sentry/browser@7.94.1/build/bundle.min.js"></script>
    {% endif %}

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .feedback-widget { position: fixed; bottom: 20px; right: 20px; z-index: 50; font-family: 'VT323', monospace; }
        .feedback-toggle-btn {
            background: #0a0a12; border: 2px solid #00ffcc; color: #00ffcc;
            padding: 8px 16px; cursor: pointer; font-size: 16px; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 4px 4px 0px #ff00ff; transition: all 0.1s;
        }
        .feedback-toggle-btn:hover { background: #00ffcc; color: #0a0a12; transform: translate(2px, 2px); box-shadow: 2px 2px 0px #ff00ff; }
        .feedback-form {
            display: none; margin-top: 20px; background: #0a0a12; border: 2px solid #ff00ff;
            padding: 16px; width: 320px; box-shadow: 4px 4px 0px #00ffcc; flex-direction: column; gap: 12px;
        }
        .feedback-form.active { display: flex; }
        .feedback-form textarea {
            width: 100%; height: 90px; background: #050508; border: 1px solid #00ffcc; color: #00ffcc;
            padding: 10px; font-family: 'VT323', monospace; font-size: 18px; resize: none; box-sizing: border-box;
        }
        .feedback-form textarea:focus { outline: none; border-color: #ff00ff; box-shadow: 0 0 5px #ff00ff; }
        .feedback-send-btn {
            background: #00ffcc; border: none; color: #0a0a12; cursor: pointer; font-family: 'Press Start 2P', cursive;
            font-size: 12px; padding: 12px; text-transform: uppercase; letter-spacing: 1px;
        }
        .feedback-send-btn:hover { background: #ff00ff; color: #0a0a12; }
    </style>
</head>
<body>
    <div class="crt-overlay"></div>

    <main class="pomodoro-card">
        <header class="brand">
            <span class="brand-dot"></span>
            <h1>25X5.EXE</h1>
        </header>

        <nav class="mode-tabs" role="tablist">
            <button class="mode-tab active" data-mode="work">FOCUS</button>
            <button class="mode-tab" data-mode="short">REBOOT</button>
            <button class="mode-tab" data-mode="long">SLEEP</button>
        </nav>

        <div class="timer-container">
            <svg class="progress-ring" viewBox="0 0 280 280">
                <circle class="progress-ring-bg" cx="140" cy="140" r="130"></circle>
                <circle class="progress-ring-fill" cx="140" cy="140" r="130"></circle>
            </svg>
            <div class="timer-display">
                <div class="time">25:00</div>
                <div class="status">&gt; INITIALIZE FOCUS</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start">[ START ]</button>
            <button class="btn btn-reset" aria-label="Reset timer">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </button>
        </div>

        <footer class="session-counter">
            <span class="session-label">CYCLE <span class="session-num">1</span></span>
            <div class="dots" aria-hidden="true">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <a href="/about" style="display:block; margin-top:15px; color:#505070; text-decoration:none; font-size:16px;">[ WHAT IS POMODORO? ]</a>
        </footer>
    </main>

    <div class="feedback-widget">
        <button id="feedback-toggle" class="feedback-toggle-btn">&gt; REPORT</button>
        <div id="feedback-form" class="feedback-form">
            <textarea id="feedback-text" placeholder="LOG ERROR OR SUGGESTION..."></textarea>
            <button id="submit-feedback" class="feedback-send-btn">TRANSMIT</button>
        </div>
    </div>

    <script>
        const SETTINGS = {{ settings | tojson }};

        {% if sentry_dsn %}
        if (window.Sentry) {
            Sentry.init({ dsn: "{{ sentry_dsn }}" });
        }
        {% endif %}
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
