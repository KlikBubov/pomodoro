<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login · Pomodoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #f6f6f8;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            margin: 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 36px;
            width: 100%; max-width: 360px;
            box-shadow: 0 24px 70px rgba(0,0,0,0.45);
        }
        h1 { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 24px; letter-spacing: 1px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        input {
            width: 100%; padding: 14px 16px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.25); color: #fff; font-size: 15px; font-family: inherit;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #ff6b6b; }
        .btn-login {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: #ff6b6b; color: #fff; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px; transition: 0.2s;
        }
        .btn-login:hover { background: #ff5252; }
        .error-msg { color: #ff6b6b; font-size: 13px; text-align: center; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>Admin Access</h1>
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/admin/login">
        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">Войти</button>
    </form>
</div>
</body>
</html>
