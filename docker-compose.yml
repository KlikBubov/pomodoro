version: '3.8'

services:
  pomodoro:
    build: .
    container_name: pomodoro-app
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - FLASK_DEBUG=false
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-super_secret_default_key}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
    volumes:
      - pomodoro_db:/app/data

  nginx:
    image: nginx:alpine
    container_name: pomodoro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - pomodoro

  certbot:
    image: certbot/certbot
    container_name: pomodoro-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done;'"

volumes:
  pomodoro_db: